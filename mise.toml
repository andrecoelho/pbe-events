# Tool versions, environment and tasks for local development.
# Setup: `brew install mise`, add `eval "$(mise activate zsh)"` to ~/.zshrc, then run `mise install`.

[tools]
bun = "1.4.4"

[env]
# Local settings and secrets (git-ignored); see .env.example.
_.file = ".env"

[tasks.db]
description = "Start the local Postgres container (docker-compose.yml)"
run = "docker compose up -d postgres"

[tasks.dev]
description = "Install dependencies and start the dev server with hot reload"
run = ["bun install", "bun dev"]
