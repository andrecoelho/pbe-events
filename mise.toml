# Tool versions, environment and tasks for local development.
# Setup: install mise (see README), add `eval "$(mise activate zsh)"` to ~/.zshrc, then run `mise install`.

[tools]
bun = "1.4.4"
# Only for evaluating the Railway config in .railway/railway.ts (`railway config plan`).
node = "26.13.1"

[env]
# Local settings and secrets (git-ignored); see .env.example.
_.file = ".env"

[tasks.db]
description = "Start the local Postgres container (docker-compose.yml)"
run = "docker compose up -d postgres"

[tasks.dev]
description = "Install dependencies, apply migrations and start the dev server with hot reload"
run = ["bun install", "bun run migrate", "bun dev"]

# The staging database has no public address; these reach it over an SSH tunnel
# with the Railway CLI. Always staging, never production.

[tasks."db:tunnel"]
description = "Open a tunnel to the staging Postgres on localhost:15432 for DB tools (Ctrl+C to close)"
run = "railway connect postgres --environment staging --tunnel-only --port 15432"

[tasks."dev:staging"]
description = "Start the dev server against the staging database (opens and closes the tunnel itself)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=15432

if ! nc -z localhost "$port" 2>/dev/null; then
  railway connect postgres --environment staging --tunnel-only --port "$port" >/dev/null 2>&1 &
  tunnel=$!
  # railway starts an ssh child; stop both when the dev server exits.
  trap 'pkill -P "$tunnel" 2>/dev/null; kill "$tunnel" 2>/dev/null' EXIT
  echo "Opening tunnel to staging Postgres on localhost:$port..."
  for _ in $(seq 1 60); do nc -z localhost "$port" 2>/dev/null && break; sleep 0.5; done
  nc -z localhost "$port" || { echo "Tunnel did not open; run 'mise run db:tunnel' to see the error." >&2; exit 1; }
fi

# Build the URL from staging's Postgres variables without printing it.
url=$(railway variables --environment staging --service postgres --json \
  | bun -e "const v = await Bun.stdin.json(); console.log('postgres://' + encodeURIComponent(v.PGUSER) + ':' + encodeURIComponent(v.PGPASSWORD) + '@localhost:$port/' + v.PGDATABASE)")

bun install
POSTGRES_URL="$url" bun dev
'''
